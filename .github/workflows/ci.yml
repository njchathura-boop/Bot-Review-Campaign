name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch for model-backed tests
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"
      - run: python -m pip install -e ".[dev,ui,nlp]"
      - run: python -m playwright install --with-deps chromium
      - run: >-
          python -m bot_campaign.cli train
          --data data/sample/labeled_reviews.jsonl
          --test-data ""
          --baseline-data ""
      - name: Validate orchestration DAG source
        run: python -m compileall -q orchestration/dags
      - run: ruff check src tests training streaming spark
      - run: pytest -q -p no:cacheprovider

  container:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve immutable image tag
        id: image
        shell: bash
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.image.outputs.value }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.value }}
          severity: CRITICAL,HIGH
          exit-code: "1"

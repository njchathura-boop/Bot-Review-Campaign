# Optional local NVIDIA GPU overlay. Use this together with docker-compose.yml:
# docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d ray-head ray-worker
#
# Only the worker sees the physical GPU. Giving the single RTX 4050 to both Ray head
# and worker would make Ray advertise the same GPU twice.
services:
  ray-worker:
    gpus: all

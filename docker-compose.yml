name: bot-campaign

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: compose
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://bot_campaign:bot_campaign@postgres:5432/bot_campaign
      MINIO_ENDPOINT: http://minio:9000
      MLFLOW_URL: http://mlflow:5000
      GRAFANA_URL: http://localhost:3000
      GIT_COMMIT: ${GIT_COMMIT:-local-compose}
      IMAGE_DIGEST: ${IMAGE_DIGEST:-bot-campaign:local}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  spark-master:
    image: apache/spark:4.0.1-scala2.13-java17-python3-ubuntu
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8082:8080"
      - "7077:7077"
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_LOCAL_HOSTNAME: spark-master
      SPARK_MASTER_HOST: spark-master

  spark-worker:
    image: apache/spark:4.0.1-scala2.13-java17-python3-ubuntu
    hostname: spark-worker
    user: root
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    environment:
      SPARK_LOCAL_HOSTNAME: spark-worker
    volumes:
      - ./:/opt/project
    ports:
      - "8083:8081"

  spark-stream:
    image: apache/spark:4.0.1-scala2.13-java17-python3-ubuntu
    hostname: spark-stream
    profiles: ["stream"]
    user: root
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1
      - /opt/project/spark/review_stream.py
    volumes:
      - ./:/opt/project
    environment:
      SPARK_LOCAL_HOSTNAME: spark-stream
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_started

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.3.2
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bot_campaign
      POSTGRES_USER: bot_campaign
      POSTGRES_PASSWORD: bot_campaign
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_campaign"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  ray-head:
    build:
      context: .
      dockerfile: docker/ray.Dockerfile
    command: ["ray", "start", "--head", "--port=6379", "--dashboard-host=0.0.0.0", "--block"]
    ports:
      - "8265:8265"
      - "6379:6379"
    shm_size: 2gb

  ray-worker:
    build:
      context: .
      dockerfile: docker/ray.Dockerfile
    command: ["ray", "start", "--address=ray-head:6379", "--block"]
    depends_on:
      - ray-head
    shm_size: 2gb

  ray-trainer:
    build:
      context: .
      dockerfile: docker/ray.Dockerfile
    profiles: ["train"]
    command:
      - python
      - training/ray_train.py
      - --ray-address
      - ray://ray-head:10001
      - --mlflow-uri
      - http://mlflow:5000
      - --data
      - data/processed/maide_labeled.jsonl
    volumes:
      - ./:/opt/project
    depends_on:
      - ray-head
      - ray-worker
      - mlflow

volumes:
  mlflow-data:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:

name: bot-campaign

x-ray-runtime: &ray-runtime
  image: bot-campaign-ray:local
  build:
    context: .
    dockerfile: docker/ray.Dockerfile
  # Ray's object store should use shared memory instead of falling back to /tmp.
  # Full DistilBERT trials need more than the default 64 MB; 4 GB is appropriate
  # when Docker Desktop has at least 12 GB assigned to WSL2.
  shm_size: 4gb
  volumes:
    - ./:/opt/project
  environment:
    PYTHONPATH: /opt/project/src

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: compose
      GRAFANA_URL: http://localhost:3000
      GRAFANA_HEALTH_URL: http://grafana:3000/api/health
      MLFLOW_URL: http://localhost:5001
      MLFLOW_HEALTH_URL: http://mlflow:5000/health
      PROMETHEUS_URL: http://localhost:9090
      PROMETHEUS_HEALTH_URL: http://prometheus:9090/-/ready
      KIBANA_URL: http://localhost:5601
      KIBANA_HEALTH_URL: http://kibana:5601/api/status
      RAY_DASHBOARD_URL: http://localhost:8265
      RAY_DASHBOARD_HEALTH_URL: http://ray-head:8265/api/jobs/
      GIT_COMMIT: ${GIT_COMMIT:-local-compose}
      IMAGE_DIGEST: ${IMAGE_DIGEST:-bot-campaign:local}
      WEB_DIR: /app/web
      REVIEW_TRANSFORMER_PATH: /models/review_distilbert
      CAMPAIGN_MODEL_PATH: /models/campaign_model
      CAMPAIGN_ALERTS_ENABLED: "true"
      PYTHONPATH: /app/src
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_RAW_REVIEWS_TOPIC: reviews.raw.v1
      KAFKA_CAMPAIGN_SCORES_TOPIC: reviews.campaign-scores.v1
      KAFKA_CAMPAIGN_ALERT_GROUP_ID: campaign-api-materializer-v1
      SPARK_MASTER: spark://spark-master:7077
      SPARK_MASTER_UI_URL: http://spark-master:8080/json/
    volumes:
      - ./src:/app/src:ro
      - ./web:/app/web:ro
      - ./artifacts/review_distilbert:/models/review_distilbert:ro
      - ./artifacts/campaign_model:/models/campaign_model:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:4.1.0
    command:
      - /bin/bash
      - -c
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic reviews.raw.v1 --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic reviews.analysis-windows.v1 --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic reviews.campaign-scores.v1 --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic reviews.campaign-scores.dlq.v1 --partitions 1 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  spark-master:
    image: apache/spark:4.0.1-scala2.13-java17-python3-ubuntu
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8082:8080"
      - "7077:7077"
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_LOCAL_HOSTNAME: spark-master
      SPARK_MASTER_HOST: spark-master

  spark-worker:
    image: apache/spark:4.0.1-scala2.13-java17-python3-ubuntu
    hostname: spark-worker
    user: root
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    environment:
      SPARK_LOCAL_HOSTNAME: spark-worker
    volumes:
      - ./:/opt/project
    ports:
      - "8083:8081"

  spark-stream:
    image: apache/spark:4.0.1-scala2.13-java17-python3-ubuntu
    hostname: spark-stream
    profiles: ["stream"]
    user: root
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1
      - /opt/project/spark/review_stream.py
    volumes:
      - ./:/opt/project
    environment:
      SPARK_LOCAL_HOSTNAME: spark-stream
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.3.2
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Ray embeds Grafana panels in its Metrics tab. Anonymous users stay
      # read-only; use admin/admin locally when a dashboard must be edited.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./.runtime/ray-grafana-dashboards:/var/lib/grafana/dashboards/ray:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    profiles: ["observability"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ["observability"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Filebeat reads Docker's JSON logs, enriches them with Docker/Compose metadata,
  # and writes them to Elasticsearch. Kibana then searches the resulting filebeat-* data.
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    profiles: ["observability"]
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./monitoring/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_started

  ray-head:
    <<: *ray-runtime
    command: ["ray", "start", "--head", "--port=6379", "--dashboard-host=0.0.0.0", "--metrics-export-port=8080", "--block"]
    environment:
      PYTHONPATH: /opt/project/src
      RAY_PROMETHEUS_HOST: http://prometheus:9090
      RAY_PROMETHEUS_NAME: Prometheus
      RAY_GRAFANA_HOST: http://grafana:3000
      RAY_GRAFANA_IFRAME_HOST: http://localhost:3000
      # Ray writes version-matched official dashboards into this shared,
      # ignored runtime directory for Grafana to provision.
      RAY_METRICS_GRAFANA_DASHBOARD_OUTPUT_DIR: /opt/project/.runtime/ray-grafana-dashboards
    ports:
      - "8265:8265"
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "ray status --address=127.0.0.1:6379"]
      interval: 10s
      timeout: 30s
      start_period: 90s
      retries: 18

  ray-worker:
    <<: *ray-runtime
    command: ["ray", "start", "--address=ray-head:6379", "--metrics-export-port=8080", "--block"]
    depends_on:
      ray-head:
        condition: service_healthy

  ray-trainer:
    <<: *ray-runtime
    profiles: ["train"]
    command:
      - ray
      - job
      - submit
      - --address
      - http://ray-head:8265
      - --
      - python
      - /opt/project/training/ray_train.py
      - --ray-address
      - auto
      - --mlflow-uri
      - http://mlflow:5000
      - --ray-storage-path
      - /opt/project/artifacts/ray_results
      - --train-data
      - /opt/project/data/processed/temporal_bundle/campaign_v3/train.jsonl
      - --validation-data
      - /opt/project/data/processed/temporal_bundle/campaign_v3/validation.jsonl
      - --test-data
      - /opt/project/data/processed/temporal_bundle/campaign_v3/test.jsonl
      - --output
      - /opt/project/artifacts/campaign_model
      - --gpus-per-trial
      - ${RAY_GPUS_PER_TRIAL:-0}
      - --max-concurrent-trials
      - ${RAY_MAX_CONCURRENT_TRIALS:-1}
    depends_on:
      ray-head:
        condition: service_healthy
      ray-worker:
        condition: service_started
      mlflow:
        condition: service_started

  ray-review-trainer:
    <<: *ray-runtime
    profiles: ["train-review"]
    command:
      - ray
      - job
      - submit
      - --address
      - http://ray-head:8265
      - --
      - python
      - /opt/project/training/ray_review_train.py
      - --ray-address
      - auto
      - --mlflow-uri
      - http://mlflow:5000
      - --ray-storage-path
      - /opt/project/artifacts/ray_results
      - --train-data
      - /opt/project/data/processed/dataset_bundle/text/training.jsonl
      - --validation-data
      - /opt/project/data/processed/dataset_bundle/text/real/validation.jsonl
      - --test-data
      - /opt/project/data/processed/dataset_bundle/text/real/test.jsonl
      - --output
      - /opt/project/artifacts/review_distilbert
      - --smoke
      - --gpus-per-trial
      - ${RAY_GPUS_PER_TRIAL:-0}
      - --max-concurrent-trials
      - ${RAY_MAX_CONCURRENT_TRIALS:-1}
    depends_on:
      ray-head:
        condition: service_healthy
      ray-worker:
        condition: service_started
      mlflow:
        condition: service_started

  campaign-scorer:
    <<: *ray-runtime
    profiles: ["stream", "score"]
    command:
      - python
      - streaming/campaign_scorer.py
      - --bundle
      - artifacts/campaign_model
      - --bootstrap-servers
      - kafka:29092
      - --input-topic
      - reviews.analysis-windows.v1
      - --output-topic
      - reviews.campaign-scores.v1
      - --dead-letter-topic
      - reviews.campaign-scores.dlq.v1
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  mlflow-data:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
  filebeat-data:

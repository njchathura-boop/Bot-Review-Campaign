apiVersion: v1
kind: Namespace
metadata:
  name: bot-campaign
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bot-campaign-config
  namespace: bot-campaign
data:
  APP_ENV: production
  DATASET_VERSION: dvc-unset
  GRAFANA_URL: https://grafana.example.internal
  MLFLOW_URL: https://mlflow.example.internal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-campaign-api
  namespace: bot-campaign
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bot-campaign-api
  template:
    metadata:
      labels:
        app: bot-campaign-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/OWNER/bot-campaign-detection:REPLACE_WITH_GIT_SHA
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: bot-campaign-config
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: bot-campaign-api
  namespace: bot-campaign
spec:
  selector:
    app: bot-campaign-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bot-campaign-api
  namespace: bot-campaign
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bot-campaign-api
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bot-campaign-api
  namespace: bot-campaign
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: bot-campaign-api

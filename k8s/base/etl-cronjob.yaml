apiVersion: batch/v1
kind: CronJob
metadata:
  name: detectra-etl
spec:
  schedule: "0 2 * * 0"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: detectra-etl
            app.kubernetes.io/component: etl
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 100
            fsGroup: 100
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: initialize-workspace
              image: busybox:1.36.1
              command: [sh, -c, "mkdir -p /workspace/data /workspace/artifacts /workspace/reports"]
              securityContext:
                runAsUser: 0
                runAsNonRoot: false
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
          containers:
            - name: etl
              image: detectra-jobs
              imagePullPolicy: IfNotPresent
              command: [bash, -lc]
              args:
                - |
                  set -euo pipefail
                  if [[ -n "${DVC_REMOTE_URL:-}" ]]; then
                    dvc remote add --local --force "${DVC_REMOTE_NAME:-kubernetes}" "$DVC_REMOTE_URL"
                    dvc remote default "${DVC_REMOTE_NAME:-kubernetes}"
                    dvc pull data/raw.dvc
                  fi
                  test -f data/raw/product_reviews.jsonl || {
                    echo "Raw inputs are missing. Configure DVC_REMOTE_URL or populate the workspace PVC." >&2
                    exit 2
                  }
                  dvc repro build_temporal_bundle build_dataset_bundle
                  if [[ -n "${DVC_REMOTE_URL:-}" ]]; then dvc push; fi
              envFrom:
                - configMapRef:
                    name: detectra-config
                - secretRef:
                    name: detectra-storage
                    optional: true
              resources:
                requests:
                  cpu: "2"
                  memory: 4Gi
                limits:
                  cpu: "8"
                  memory: 12Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: data
                  mountPath: /opt/project/data
                  subPath: data
                - name: artifacts
                  mountPath: /opt/project/artifacts
                  subPath: artifacts
                - name: reports
                  mountPath: /opt/project/reports/generated
                  subPath: reports
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: workspace
              persistentVolumeClaim:
                claimName: detectra-workspace
            - name: data
              persistentVolumeClaim:
                claimName: detectra-workspace
            - name: artifacts
              persistentVolumeClaim:
                claimName: detectra-workspace
            - name: reports
              persistentVolumeClaim:
                claimName: detectra-workspace
            - name: tmp
              emptyDir: {}

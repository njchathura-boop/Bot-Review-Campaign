apiVersion: apps/v1
kind: Deployment
metadata:
  name: detectra-mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: detectra-mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detectra-mlflow
        app.kubernetes.io/component: experiment-tracking
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-storage
          image: busybox:1.36.1
          command: [sh, -c, "mkdir -p /mlflow/artifacts && chown -R 1000:1000 /mlflow"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: mlflow
              mountPath: /mlflow
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.3.2
          command: [mlflow]
          args:
            - server
            - --host=0.0.0.0
            - --port=5000
            - --backend-store-uri=sqlite:////mlflow/mlflow.db
            - --default-artifact-root=/mlflow/artifacts
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: mlflow
              mountPath: /mlflow
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mlflow
          persistentVolumeClaim:
            claimName: detectra-mlflow
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: detectra-mlflow
spec:
  selector:
    app.kubernetes.io/name: detectra-mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http

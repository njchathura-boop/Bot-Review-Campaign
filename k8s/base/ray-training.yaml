apiVersion: apps/v1
kind: Deployment
metadata:
  name: detectra-ray
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: detectra-ray
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detectra-ray
        app.kubernetes.io/component: model-training
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-workspace
          image: busybox:1.36.1
          command: [sh, -c, "mkdir -p /workspace/data /workspace/artifacts /workspace/reports"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: ray
          image: detectra-jobs
          imagePullPolicy: IfNotPresent
          command: [ray]
          args:
            - start
            - --head
            - --port=6379
            - --dashboard-host=0.0.0.0
            - --metrics-export-port=8080
            - --block
          envFrom:
            - configMapRef:
                name: detectra-config
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://detectra-mlflow:5000
          ports:
            - name: dashboard
              containerPort: 8265
            - name: gcs
              containerPort: 6379
            - name: metrics
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/version
              port: dashboard
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/version
              port: dashboard
            periodSeconds: 10
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 12Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /opt/project/data
              subPath: data
            - name: artifacts
              mountPath: /opt/project/artifacts
              subPath: artifacts
            - name: reports
              mountPath: /opt/project/reports/generated
              subPath: reports
            - name: ray-tmp
              mountPath: /tmp/ray
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: detectra-workspace
        - name: data
          persistentVolumeClaim:
            claimName: detectra-workspace
        - name: artifacts
          persistentVolumeClaim:
            claimName: detectra-workspace
        - name: reports
          persistentVolumeClaim:
            claimName: detectra-workspace
        - name: ray-tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: detectra-ray
spec:
  selector:
    app.kubernetes.io/name: detectra-ray
  ports:
    - name: dashboard
      port: 8265
      targetPort: dashboard
    - name: gcs
      port: 6379
      targetPort: gcs
    - name: metrics
      port: 8080
      targetPort: metrics

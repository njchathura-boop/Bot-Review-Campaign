apiVersion: v1
kind: Pod
metadata:
  name: detectra-data-loader
  namespace: bot-campaign
spec:
  restartPolicy: Never
  containers:
    - name: loader
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 86400"]
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: detectra-workspace
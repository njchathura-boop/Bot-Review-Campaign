# Copy to a private file, replace every value, and apply before the full overlay.
# Never commit the populated secret.
apiVersion: v1
kind: Secret
metadata:
  name: detectra-airflow-secrets
  namespace: bot-campaign
type: Opaque
stringData:
  postgres-password: replace-with-a-strong-database-password
  database-uri: postgresql+psycopg2://airflow:REPLACE_URL_ENCODED_PASSWORD@detectra-airflow-postgres:5432/airflow
  fernet-key: replace-with-output-of-airflow-fernet-key-generator
  jwt-secret: replace-with-at-least-32-random-bytes
  simple-auth-passwords.json: '{"admin":"replace-with-a-strong-password"}'

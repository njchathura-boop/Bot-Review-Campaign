apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: detectra-elasticsearch
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: detectra-elasticsearch
spec:
  serviceName: detectra-elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: detectra-elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detectra-elasticsearch
        app.kubernetes.io/component: log-storage
    spec:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-storage
          image: busybox:1.36.1
          command: [sh, -c, "chown -R 1000:1000 /usr/share/elasticsearch/data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.license.self_generated.type
              value: basic
            - name: ES_JAVA_OPTS
              value: -Xms1g -Xmx1g
          ports:
            - name: http
              containerPort: 9200
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: detectra-elasticsearch
---
apiVersion: v1
kind: Service
metadata:
  name: detectra-elasticsearch
spec:
  selector:
    app.kubernetes.io/name: detectra-elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detectra-kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: detectra-kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detectra-kibana
        app.kubernetes.io/component: log-search
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.15.3
          env:
            - name: ELASTICSEARCH_HOSTS
              value: http://detectra-elasticsearch:9200
            - name: XPACK_SECURITY_ENABLED
              value: "false"
            - name: SERVER_PUBLICBASEURL
              value: http://localhost:5601
          ports:
            - name: http
              containerPort: 5601
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: detectra-kibana
spec:
  selector:
    app.kubernetes.io/name: detectra-kibana
  ports:
    - name: http
      port: 5601
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: detectra-kibana-setup
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detectra-kibana-setup
        app.kubernetes.io/component: log-search-setup
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-data-view
          image: curlimages/curl:8.10.1
          command: [sh, -ec]
          args:
            - |
              until curl -fsS http://detectra-kibana:5601/api/status >/dev/null; do sleep 5; done
              status="$(curl -sS -o /tmp/kibana-response.json -w '%{http_code}' \
                -X POST http://detectra-kibana:5601/api/data_views/data_view \
                -H 'kbn-xsrf: detectra-kubernetes-setup' \
                -H 'Content-Type: application/json' \
                --data '{"data_view":{"title":"detectra-logs-*","name":"Detectra logs","timeFieldName":"@timestamp"}}')"
              case "$status" in
                200|409) cat /tmp/kibana-response.json ;;
                *) cat /tmp/kibana-response.json >&2; exit 1 ;;
              esac
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: detectra-filebeat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: detectra-filebeat
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: detectra-filebeat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: detectra-filebeat
subjects:
  - kind: ServiceAccount
    name: detectra-filebeat
    namespace: bot-campaign
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: detectra-filebeat-config
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: filestream
        id: detectra-kubernetes-containers
        enabled: true
        paths:
          - /var/log/containers/*_bot-campaign_*.log
        parsers:
          - container:
              stream: all
              format: auto
    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
            - logs_path:
                logs_path: /var/log/containers/
      - add_fields:
          target: project
          fields:
            name: detectra
            environment: kubernetes
    setup.kibana.host: http://detectra-kibana:5601
    output.elasticsearch:
      hosts: [http://detectra-elasticsearch:9200]
      index: detectra-logs-%{+yyyy.MM.dd}
    setup.template.name: detectra-logs
    setup.template.pattern: detectra-logs-*
    setup.ilm.enabled: false
    logging.to_stderr: true
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: detectra-filebeat
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: detectra-filebeat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detectra-filebeat
        app.kubernetes.io/component: log-shipper
    spec:
      serviceAccountName: detectra-filebeat
      terminationGracePeriodSeconds: 30
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.15.3
          args: ["-e", "-c", "/etc/filebeat.yml"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat.yml
              subPath: filebeat.yml
              readOnly: true
            - name: container-logs
              mountPath: /var/log/containers
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: data
              mountPath: /usr/share/filebeat/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: detectra-filebeat-config
            defaultMode: 0444
        - name: container-logs
          hostPath:
            path: /var/log/containers
            type: Directory
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - elasticsearch-kibana.yaml
  - filebeat.yaml

patches:
  - path: api-observability-patch.yaml

images:
  - name: detectra-api
    newName: ghcr.io/njchathura-boop/bot-review-campaign-api
    newTag: latest
  - name: detectra-jobs
    newName: ghcr.io/njchathura-boop/bot-review-campaign-jobs
    newTag: latest

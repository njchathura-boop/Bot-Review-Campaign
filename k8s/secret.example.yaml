# Copy this file to a private location, replace the placeholders, and apply it.
# Never commit the populated secret.
apiVersion: v1
kind: Secret
metadata:
  name: detectra-storage
  namespace: bot-campaign
type: Opaque
stringData:
  DVC_REMOTE_URL: s3://replace-with-your-bucket/detectra
  AWS_ACCESS_KEY_ID: replace-me
  AWS_SECRET_ACCESS_KEY: replace-me
  AWS_DEFAULT_REGION: ap-south-1
---
apiVersion: v1
kind: Secret
metadata:
  name: detectra-grafana-admin
  namespace: bot-campaign
type: Opaque
stringData:
  admin-user: admin
  admin-password: replace-with-a-strong-password

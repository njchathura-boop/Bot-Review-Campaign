  # Generate with:
  # python -c "import secrets; print(secrets.token_urlsafe(48))"
  jwt-secret: REPLACE_WITH_RANDOM_JWT_SECRET
  simple-auth-passwords.json: '{"admin":"REPLACE_WITH_STRONG_AIRFLOW_ADMIN_PASSWORD"}'

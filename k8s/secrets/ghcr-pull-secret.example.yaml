# OPTIONAL TEMPLATE for private GitHub Container Registry packages.
# Skip this file when all three Detectra GHCR packages are public or when using local
# Docker Desktop images. Copy it to ghcr-pull-secret.local.yaml and replace all values.
apiVersion: v1
kind: Secret
metadata:
  name: detectra-ghcr-pull
  namespace: bot-campaign
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "REPLACE_WITH_GITHUB_USERNAME",
          "password": "REPLACE_WITH_GITHUB_TOKEN_AUTHORIZED_TO_PULL_PACKAGES",
          "auth": "REPLACE_WITH_BASE64_OF_USERNAME_COLON_TOKEN"
        }
      }
    }
---
# Most Detectra workloads use the namespace's default ServiceAccount. Attaching the pull
# secret here lets those pods authenticate to GHCR without modifying every Deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: bot-campaign
imagePullSecrets:
  - name: detectra-ghcr-pull

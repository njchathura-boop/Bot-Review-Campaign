name: bot-campaign-airflow

x-airflow-common: &airflow-common
  image: apache/airflow:3.1.3
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-local-development-only}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    BOT_CAMPAIGN_RAY_JOBS_URL: http://host.docker.internal:8265
    BOT_CAMPAIGN_GPUS_PER_TRIAL: ${BOT_CAMPAIGN_GPUS_PER_TRIAL:-0}
    BOT_CAMPAIGN_MAX_CONCURRENT_TRIALS: ${BOT_CAMPAIGN_MAX_CONCURRENT_TRIALS:-1}
    BOT_CAMPAIGN_BEHAVIORAL_INPUTS: ${BOT_CAMPAIGN_BEHAVIORAL_INPUTS:-data/raw/amazon_all_beauty_sample.jsonl}
    BOT_CAMPAIGN_TEMPORAL_ROOT: ${BOT_CAMPAIGN_TEMPORAL_ROOT:-data/processed/temporal_bundle}
    BOT_CAMPAIGN_CAMPAIGN_SCENARIO_COUNT: ${BOT_CAMPAIGN_CAMPAIGN_SCENARIO_COUNT:-2000}
    BOT_CAMPAIGN_DATA_SEED: ${BOT_CAMPAIGN_DATA_SEED:-42}
    BOT_CAMPAIGN_API_URL: http://host.docker.internal:8000
  volumes:
    - ./dags:/opt/airflow/dags/bot_campaign:ro
    - ..:/opt/project
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate &&
        airflow users create --username ${AIRFLOW_ADMIN_USER:-admin}
        --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
        --firstname Platform --lastname Admin --role Admin
        --email ${AIRFLOW_ADMIN_EMAIL:-admin@example.local} || true
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-api-server:
    <<: *airflow-common
    command: api-server --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-postgres:

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-campaign-detector"
version = "0.1.0"
description = "Fake-review classification and coordinated campaign detection"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.8,<1"]
mlops = ["dvc>=3.56,<4", "mlflow>=2.18,<4"]
streaming = ["confluent-kafka>=2.6,<4", "datasets>=3,<5"]
distributed = ["ray[default]>=2.40,<3", "mlflow>=3,<4"]
synthetic = ["Faker>=40,<41"]

[project.scripts]
bot-campaign = "bot_campaign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
